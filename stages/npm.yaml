- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- shell:
    - description: "💫💫💫  NPM Packages 💫💫💫"
      command: |
        if  [ -e ".state/npm.skip" ]; then
          echo "😎 Skipping npm install"
        else
          echo "⌛ Installing global npm packages"
          npm install -g @antfu/ni eslint prettier node-ts typescript jsdom vitest npkill corepack
          corepack enable
          touch .state/npm.skip
        fi
