- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]
- link:
    ~/.config/:
      glob: true
      force: true
      path: config/*
    ~/.terminfo:
      force: true
      path: config/.terminfo
    ~/.local/bin/t: config/taskfile/t.sh

- link:
    ~/.local/bin/:
      force: true
      glob: true
      path: bin/*
- create:
    - ~/.config
    - ~/.config/local
    - ~/.local/bin
    - ~/Projects
    - .state
