- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- shell:
    - [./Taskfile app zap]
    - [sudo ./Taskfile app brew]
    - [./Taskfile app git]
    - [./Taskfile app fnm]
    - [./Taskfile app rust]
    - [./Taskfile app bob]
    - [./Taskfile app special_node]
    - [./Taskfile app nvim]
    - [./Taskfile app fswatch]
    - [./Taskfile app nvr]
    - [./Taskfile app fdfind]
    - [./Taskfile app ripgrep]
    - [./Taskfile app jq]
    - [./Taskfile app zoxide]
    - [./Taskfile app bat]
    - [./Taskfile app eza]
    - [./Taskfile app fzf]
