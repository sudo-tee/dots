- defaults:
    shell:
      stdout: true
      stderr: true
      quiet: true

- shell:
    - description: "💫💫💫 Running $DOT_ENV install file 💫💫💫"
      command: |
        echo "⚒  [${DOT_ENV}] enviroment detected"
        if [ -d "./$DOT_ENV" ]; then
          CONFIG=${DOT_ENV}/install.yaml ./install
        else
          echo "⚠️ ⚒  No installation file for env [${DOT_ENV}]"
        fi
