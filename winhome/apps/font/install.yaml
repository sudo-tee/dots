- defaults:
    shell:
      stdout: true
      stderr: true
      quiet: true
- shell:
  - ["", 💿💿💿 Installing font 💿💿💿]
  - [wget https://github.com/arrowtype/recursive/releases/download/v1.085/ArrowType-Recursive-1.085.zip -O /tmp/ArrowType-Recursive-1.085.zip]
  - [cd /tmp && unzip ArrowType-Recursive-1.085.zip]
  - [cp /tmp/ArrowType-Recursive-1.085/Recursive_Code/RecMonoDuotone/RecMonoDuotone-Regular-1.085.ttf ~/winhome/]
  - [fontview.exe c:\\Users\\fbelanger\\RecMonoDuotone-Regular-1.085.ttf] 
  - [rm -rf /tmp/ArrowType-Recursive-*]
  - [rm ~/winhome/RecMonoDuotone-Regular-1.085.ttf]
