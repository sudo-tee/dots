- defaults:
    shell:
      stdout: true
      stderr: true
      quiet: true

- shell:
    - description: "💫💫💫 WINHOME 💫💫💫"
      command: |
        if  [ -e "$HOME/winhome" ]; then
          mkdir -p  ~/winhome/.config/wezterm/
          echo "📁 Copying config files for wezterm"
          cp -r winhome/config/wezterm/* ~/winhome/.config/wezterm/
                    
          mkdir -p  ~/winhome/.config/projects/
          cp -r $DOT_ENV/config/projects/* ~/winhome/.config/projects/
        else
          echo "Nothing to do"
        fi
