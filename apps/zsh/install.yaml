- defaults:
    link:
      create: true
      relink: true

- create:
    - ~/.config/local/zsh
    - ~/.config/local/zsh/includes

- shell:
   - [ sudo apt install zsh, 💿💿💿 Installing zsh 💿💿💿]
   - [ chsh -s $(which zsh), Setting zsh to default shell ]


- link:
    ~/.terminfo:
      force: true
      path: apps/zsh/config/.terminfo
    ~/.config/zsh/ulimit.sh:
      force: true
      path: apps/zsh/config/ulimit.sh
    ~/.config/zsh/aliases.sh:
      force: true
      path: apps/zsh/config/aliases.sh
    ~/.config/zsh/wezterm.sh:
      force: true
      path: apps/zsh/config/wezterm.sh
    ~/.config/zsh/includes/_wezterm.sh:
      force: true
      path: apps/zsh/_wezterm.sh
    ~/.zshrc:
      force: true
      path: apps/zsh/config/.zshrc
    ~/.zprofile:
      force: true
      path: apps/zsh/config/.zprofile
    ~/.zshenv:
      force: true
      path: apps/zsh/config/.zshenv

