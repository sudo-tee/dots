- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true
- link:
    ~/.config/zsh/includes/_zoxide.sh:
      force: true
      path: apps/zoxide/_zoxide.sh
- shell:
    - description: "💫💫💫 Installing zoxide 💫💫💫"
      command: |
        if  [ -e ".state/zoxide.skip" ]; then
          echo "😎 Skipping zoxide install"
        else
          echo "⌛ Installing zoxide "
          brew install zoxide
          touch .state/zoxide.skip
        fi
- shell:
    - [source ~/.zshrc]
