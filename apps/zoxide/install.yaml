- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true
- link:
    ~/.config/zsh/includes/_zoxide.sh:
      force: true
      path: apps/zoxide/_zoxide.sh
- shell:
    - description: "💿💿💿 Installing zoxide 💿💿💿"
      command: |
          brew install zoxide
- shell:
    - [source ~/.zshrc]
