- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true
- shell:
    - description: "💫💫💫 Installing jq 💫💫💫"
      command: |
        if  [ -e ".state/jq.skip" ]; then
          echo "😎 Skipping jq install"
        else
          echo "⌛ Installing jq "
          brew install jq
          touch .state/jq.skip
        fi
