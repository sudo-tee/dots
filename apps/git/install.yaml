- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true
- link:
    ~/.gitconfig:
      force: true
      path: apps/git/config/.gitconfig
    ~/.gitconfig.github:
      force: true
      path: apps/git/config/.gitconfig.github
    ~/.gitignore:
      force: true
      path: apps/git/config/.gitignore

- shell:
    - description: "💫💫💫 Installing git 💫💫💫"
      command: |
        if  [ -e ".state/git.skip" ]; then
          echo "😎 Skipping git install"
        else
          echo "⌛ Installing git "
          brew install git
          touch .state/git.skip
        fi
