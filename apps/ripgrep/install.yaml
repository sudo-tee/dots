- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- clean: ["~"]
- link:
    ~/.ripgreprc:
      force: true
      glob: true
      path: apps/ripgrep/config/.ripgreprc
- link:
    ~/.config/zsh/includes/_rg.sh:
      force: true
      path: apps/ripgrep/_ripgrep.sh
- shell:
    - description: "💿💿💿 Installing rg 💿💿💿"
      command: |
          brew install rg
