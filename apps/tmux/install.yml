- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- clean: ["~"]
- create:
    - "$HOME/.config/tmux"
- link:
    ~/.tmux.conf:
      force: true
      path: apps/tmux/tmux.conf
    ~/.config/tmux:
      force: true
      glob: true
      path: apps/tmux/config/*

- shell:
    - description: "💿💿💿  Installing tmux tpm 💿💿💿"
      command: |
          git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
    - description: "💿💿💿  Installing smug for tmux 💿💿💿"
      command: |
          brew install smug
