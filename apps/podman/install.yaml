- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- link:
    ~/.config/containers/registries.conf:
      force: true
      path: apps/podman/config/registries.conf

- shell:
    - description: "💿💿💿 Installing podman 💿💿💿"
      command: |
        sudo apt install -y podman
        sudo ln -sf "$(command -v podman)" /usr/local/bin/docker
