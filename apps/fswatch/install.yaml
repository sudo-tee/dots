- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- clean: ["~"]
- shell:
    - description: "💫💫💫  Installing fswatch 💫💫💫"
      command: |
        if  [ -e ".state/fswatch.skip" ]; then
          echo "😎 Skipping fswatch install"
        else
          echo "⌛ Installing fswatch"
          brew install fswatch
          touch .state/fswatch.skip
        fi
