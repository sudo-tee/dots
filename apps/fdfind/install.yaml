- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- create:
    - ~/.config/fd
- link:
    ~/.config/fd/ignore:
      force: true
      glob: true
      path: apps/fdfind/config/ignore
- shell:
    - description: "💿💿💿 Installing fdfind 💿💿💿"
      command: |
          brew install fd && \
          ln -s $(which fd) ~/.local/bin/fdfind && \
