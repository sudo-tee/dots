- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- clean: ["~"]

- link:
    ~/.config/zsh/includes/_bob.sh:
      force: true
      path: apps/bob/_bob.sh
- shell:
    - description: "💿💿💿 Installing bob 💿💿💿"
      command: |
          cargo install bob-nvim
          source ~/.zshrc

