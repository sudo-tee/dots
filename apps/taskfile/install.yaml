- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- link:
    ~/.config/taskfile/:
      force: true
      glob: true
      path: apps/taskfile/config/*
    ~/.local/bin/t: 
      force: true
      path: apps/taskfile/bin/t.sh
- shell:
    - description: "💿💿💿 Installing taskfile 💿💿💿"
      command: |
          chmod u+x ~/.local/bin/t
