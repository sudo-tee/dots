- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- link:
    ~/.config/taskfile/:
      force: true
      glob: true
      path: apps/taskfile/config/*
    ~/.local/bin/t: 
      force: true
      path: apps/taskfile/bin/t.sh
- shell:
    - description: "💫💫💫 Installing taskfile 💫💫💫"
      command: |
        if  [ -e ".state/taskfile.skip" ]; then
          echo "😎 Skipping taskfile install"
        else
          echo "⌛ Installing taskfile "
          chmod u+x ~/.local/bin/t
          touch .state/taskfile.skip
        fi
