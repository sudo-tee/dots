- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- clean: ["~"]

- create:
    - ~/.config/nvim
- link:
    ~/.config/nvim/:
      force: true
      path: apps/nvim/config
    ~/.config/zsh/includes/_nvim.sh:
      force: true
      path: apps/nvim/_nvim.sh
    
- shell:
    - description: "💿💿💿 installing nvim"
      command: |
          bob install nightly
          bob use nightly
