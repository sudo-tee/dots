- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- clean: ["~"]
- create:
    - "~/.config/wezterm"
- link:
    ~/.config/wezterm/wezterm.lua:
      force: true
      relink: true
      path: apps/wezterm/config/wezterm.lua

- shell:
    - description: "💫💫💫  Installing wezterm [server] 💫💫💫"
      command: |
        if  [ -e ".state/wezterm.skip" ]; then
          echo "😎 Skipping wezterm install"
        else
          echo "⌛ Installing wezterm"
           (
            cd /tmp
            wget https://github.com/wez/wezterm/releases/download/20230712-072601-f4abf8fd/wezterm-20230712-072601-f4abf8fd.Ubuntu22.04.deb
            sudo apt install -y ./wezterm-20230712-072601-f4abf8fd.Ubuntu22.04.deb
           )
           touch .state/wezterm.skip
        fi
