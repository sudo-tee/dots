- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true
      quiet: true

- clean: ["~"]
- create:
    - "$HOME/.config/smug"
- link:
    ~/.config/smug:
      force: true
      glob: true
      path: apps/smug/config/*

- shell:
    - description: "💿💿💿  Installing smug for tmux 💿💿💿"
      command: |
          brew install smug
