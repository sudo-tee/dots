- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      quiet: true

- clean: ["~"]

- shell:
    - [./app brew]
    - [./app fnm]
    - [./app rust]
    - [./app bob]
    - [./app fzf]
    - [./app nvr]
    - [./app fdfind]
    - [./app ripgrep]
    - [./app jq]

- shell:
    - [CONFIG="stages/links.yaml" ./install]

- shell:
    - [CONFIG="stages/npm.yaml" ./install]

- shell:
    - [CONFIG="stages/env.yaml" ./install]

- shell:
    - [CONFIG="winhome/install.yaml" ./install]

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [chmod u+x -R ~/.local/bin]
    - [source ~/.zshrc]
