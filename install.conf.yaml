- defaults:
    link:
      create: true
      relink: true
    include:
      isolated: False

- clean: ["~"]
- link:
    ~/.config/:
      glob: true
      path: config/*
    ~/.zshrc:
      force: true
      path: zshrc/.zshrc
    ~/.zprofile:
      force: true
      path: zshrc/.zprofile
    ~/.zshenv:
      force: true
      path: zshrc/.zshenv
    ~/.local/bin/t: config/taskfile/t.sh
- create:
    - ~/.config
    - ~/.config/work
    - ~/.local/bin
    - ~/Projects

- npm:
    - "@antfu/ni pnpm eslint prettier node-ts typescript yarn jsdom vitest npkill"

- if:
    cond: '[ -e "$HOME/winhome" ]'
    met:
      - create:
          - ~/winhome/.config/wezterm/
      - shell:
          - echo "📁 Copying config files for wezterm"
          - cp -r config/wezterm/* ~/winhome/.config/wezterm/

# WORK enviroment specific files
- if:
    cond: '[ "$DOT_ENV" = "work" ]'
    met:
      - shell:
          - echo "⚒  Work enviroment detected"
      - link:
          ~/.gitconfig:
            force: true
            path: work/gitconfig/.gitconfig
          ~/.gitignore:
            force: true
            path: work/gitconfig/.gitignore
          ~/.config/work/:
            glob: true
            path: work/config/*
    unmet:
      - link:
          ~/.gitconfig:
            force: true
            path: gitconfig/.gitconfig
          ~/.gitignore:
            force: true
            path: gitconfig/.gitignore

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [chmod u+x -R ~/.local/bin]
    - [source ~/.zshrc]
