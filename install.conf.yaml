- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      quiet: true

- clean: ["~"]

- shell:
    - [CONFIG="stages/links.yaml" ./install]

- shell:
    - [CONFIG="stages/npm.yaml" ./install]

- shell:
    - [CONFIG="stages/env.yaml" ./install]

- shell:
    - [CONFIG="stages/winhome.yaml" ./install]

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [chmod u+x -R ~/.local/bin]
    - [source ~/.zshrc]
