- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      quiet: true

- clean: ["~"]
- link:
    ~/.config/:
      glob: true
      path: config/*
    ~/.zshrc:
      force: true
      path: zshrc/.zshrc
    ~/.zprofile:
      force: true
      path: zshrc/.zprofile
    ~/.zshenv:
      force: true
      path: zshrc/.zshenv
    ~/.tmux.conf:
      force: true
      path: tmuxconf/tmux.conf
    ~/.gitconfig:
      force: true
      path: gitconfig/.gitconfig
    ~/.gitignore:
      force: true
      path: gitconfig/.gitignore
    ~/.local/bin/t: config/taskfile/t.sh
- create:
    - ~/.config
    - ~/.config/local
    - ~/.config/local/zsh
    - ~/.local/bin
    - ~/Projects
    - .state

- shell:
    - [CONFIG="stages/npm.conf.yaml" ./install]

- shell:
    - [CONFIG="stages/winhome.conf.yaml" ./install]

- shell:
    - description: "💫💫💫 Running $DOT_ENV install file 💫💫💫"
      command: |
        echo "⚒  [${DOT_ENV}] enviroment detected"
        if [ -d "./$DOT_ENV" ]; then
          CONFIG=${DOT_ENV}/install.conf.yaml ./install
        else
          echo "⚠️ ⚒  No installation file for env [${DOT_ENV}]"
        fi

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [chmod u+x -R ~/.local/bin]
    - [source ~/.zshrc]
