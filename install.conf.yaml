- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      quiet: true

- clean: ["~"]
- link:
    ~/.config/:
      glob: true
      path: config/*
    ~/.zshrc:
      force: true
      path: zshrc/.zshrc
    ~/.zprofile:
      force: true
      path: zshrc/.zprofile
    ~/.zshenv:
      force: true
      path: zshrc/.zshenv
    ~/.gitconfig:
      force: true
      path: gitconfig/.gitconfig
    ~/.gitignore:
      force: true
      path: gitconfig/.gitignore
    ~/.local/bin/t: config/taskfile/t.sh
    ~/.local/bin/xdg-open: bin/xdg-open
    ~/.local/bin/xdg-start: bin/xdg-start
- create:
    - ~/.config
    - ~/.config/local
    - ~/.config/local/zsh
    - ~/.local/bin
    - ~/Projects
    - .state
