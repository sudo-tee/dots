- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      quiet: true

- clean: ["~"]
- link:
    ~/.config/:
      glob: true
      path: config/*
    ~/.zshrc:
      force: true
      path: zshrc/.zshrc
    ~/.zprofile:
      force: true
      path: zshrc/.zprofile
    ~/.zshenv:
      force: true
      path: zshrc/.zshenv
    ~/.gitconfig:
      force: true
      path: gitconfig/.gitconfig
    ~/.gitignore:
      force: true
      path: gitconfig/.gitignore
    ~/.local/bin/t: config/taskfile/t.sh
- create:
    - ~/.config
    - ~/.config/local
    - ~/.config/local/zsh
    - ~/.local/bin
    - ~/Projects

- shell:
    - description: "💫💫💫  NPM Packages 💫💫💫"
      command: |
        if  [ -e ".state/npm.skip" ]; then
          echo "😎 Skipping npm install"
        else
          echo "⌛ Installing global npm packages"
          npm install -g @antfu/ni pnpm eslint prettier node-ts typescript yarn jsdom vitest npkill
        fi

- shell:
    - description: "💫💫💫  WINHOME 💫💫💫"
      command: |
        if  [ -e "$HOME/winhome" ]; then
          mkdir -p  ~/winhome/.config/wezterm/
          echo "📁 Copying config files for wezterm"
          cp -r config/wezterm/* ~/winhome/.config/wezterm/
        else
          echo "Nothing to do"
        fi

- shell:
    - description: "💫💫💫 Running $DOT_ENV install file 💫💫💫"
      command: |
        echo "⚒  [${DOT_ENV}] enviroment detected"
        if [ -d $DOT_ENV ]; then
          CONFIG=${DOT_ENV}/install.conf.yaml ./install
        else
          echo "⚠️ ⚒  No installation file for env [${DOT_ENV}]"
        fi

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [chmod u+x -R ~/.local/bin]
    - [source ~/.zshrc]
